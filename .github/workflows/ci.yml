name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sigope
          POSTGRES_USER: sigope
          POSTGRES_PASSWORD: sigope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigope -d sigope"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DJANGO_DEBUG: "False"
      POSTGRES_DB: sigope
      POSTGRES_USER: sigope
      POSTGRES_PASSWORD: sigope
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: back
      - name: Check Django configuration
        run: python manage.py check
        working-directory: back
      - name: Run tests with coverage
        run: coverage run --source=accounts,catalog,inspections,config manage.py test
        working-directory: back
      - name: Report coverage
        run: |
          coverage report --show-missing --fail-under=90
          coverage xml -o coverage.xml
        working-directory: back
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: back/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: front
      - name: Build frontend
        run: npm run build
        working-directory: front
